name: gryaz_store
description: Gryaz Store - магазин приложений из GitHub Releases
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
