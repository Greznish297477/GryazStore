name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0" >> $GITHUB_ENV
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}

      - name: List APK
        run: find build/app/outputs -name "*.apk" -ls || true

      - name: Prepare dist
        run: |
          mkdir -p dist
          APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "dist/GryazStore-v${{ env.VERSION }}.apk"
            ls -lh dist/
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gryaz-store-apk
          path: dist/*.apk
          if-no-files-found: error

      # Автоматический релиз при пуше тега v1.0.0, v1.0.1 и т.д.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: Gryaz Store ${{ github.ref_name }}
          body: |
            ## Gryaz Store ${{ github.ref_name }}

            Магазин приложений из GitHub Releases.

            ### Установка
            1. Скачай APK ниже
            2. Разреши установку из неизвестных источников
            3. Установи
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Если релиз создали вручную на сайте GitHub
      - name: Attach APK to existing Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
